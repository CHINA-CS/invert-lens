<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>反色滤镜片</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="frame" data-mode="combo" data-effect="on" data-capture="live" data-interactive="false">
    <div id="viewport">
      <!-- 隐藏的采集源 -->
      <video id="screen-video" autoplay muted playsinline playsInline></video>
      <!-- 显示层：裁剪镜片区 + 抹掉指针 + CSS 滤镜 -->
      <canvas id="view-canvas"></canvas>
    </div>

    <div id="empty-hint">准备中…</div>

    <div id="drag-bar" title="按住拖动镜片">
      <div id="grip"></div>
    </div>

    <div id="chrome">
      <div id="toolbar">
        <button type="button" id="btn-effect" title="开关滤镜">滤镜</button>
        <button type="button" id="btn-mode" title="切换模式">模式</button>
        <button type="button" id="btn-capture" title="冻结 / 实时">实时</button>
        <button type="button" id="btn-refresh" title="重新截取当前画面">刷新</button>
        <label id="bright-ctrl" title="降低镜片内画面亮度（与按钮同一行）">
          <span class="bright-label">亮度</span>
          <input type="range" id="brightness" min="10" max="100" step="5" value="100" />
          <span id="brightness-label">100%</span>
        </label>
      </div>
      <div id="hint">Ctrl+Alt+C 唤出/隐藏 · 指针像素已从画面抹除</div>
    </div>

    <div class="handle n" data-dir="n"></div>
    <div class="handle s" data-dir="s"></div>
    <div class="handle e" data-dir="e"></div>
    <div class="handle w" data-dir="w"></div>
    <div class="handle ne" data-dir="ne"></div>
    <div class="handle nw" data-dir="nw"></div>
    <div class="handle se" data-dir="se"></div>
    <div class="handle sw" data-dir="sw"></div>

    <div id="border"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
